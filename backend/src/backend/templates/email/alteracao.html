<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>{{ titulo }}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    "
  >
    <style>
      .TituloDetalhe {
        font-size: 16px;
        font-weight: bold;
        color: #333;
        padding-top: 10px;
      }

      .ValorDetalhe {
        font-size: 14px;
        color: #555;
        padding-top: 5px;
      }
    </style>

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 30px 0">
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #ffffff;
              border-radius: 10px;
              min-height: 600px;
              padding: 30px;
              box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            "
          >
            <!-- TÍTULO -->
            <tr>
              <td
                style="
                  font-size: 24px;
                  font-weight: bold;
                  color: #222;
                  text-align: center;
                "
              >
                {{ titulo }}
              </td>
            </tr>

            <tr>
              <td style="height: 20px"></td>
            </tr>

            <!-- MENSAGEM -->
            <tr>
              <td
                style="
                  font-size: 15px;
                  color: #555;
                  line-height: 1.6;
                  text-align: left;
                "
              >
                {{ mensagem | safe }}
              </td>
            </tr>

            <tr>
              <td
                style="
                  height: 25px;
                  font-weight: bold;
                  color: #333;
                  font-size: 14px;
                  padding: 10px 0;
                "
              >
                Detalhes:
              </td>
            </tr>

            <!-- TABELA DETALHES -->
            <tr>
              <td>
                <table
                  width="100%"
                  cellpadding="10"
                  cellspacing="0"
                  style="
                    background: #fafafa;
                    border-radius: 8px;
                    border: 1px solid #ececec;
                    font-size: 14px;
                    cursor: default;
                  "
                >
                  {% for chave, valor in detalhes.items() %}
                  <tr>
                    <td
                      width="40%"
                      style="
                        font-size: 16px;
                        font-weight: bold;
                        color: #333;
                        padding-top: 10px;
                      "
                    >
                      {{ chave }}
                    </td>
                    <td
                      width="60%"
                      style="font-size: 14px; color: #555; padding-top: 5px"
                    >
                      {{ valor }}
                    </td>
                  </tr>
                  {% endfor %}
                </table>
              </td>
            </tr>

            <tr>
              <td style="height: 30px"></td>
            </tr>

            <!-- BOTÃO DE AÇÃO -->
            <tr>
              <td align="center">
                <a
                  href="{{ link }}"
                  style="
                    display: inline-block;
                    background: #8e4caf;
                    color: #fff;
                    padding: 12px 70px;
                    text-decoration: none;
                    border-radius: 6px;
                    font-size: 14px;
                    font-weight: bold;
                  "
                >
                  Iniciar Processo
                </a>
              </td>
            </tr>

            <tr>
              <td style="height: 25px"></td>
            </tr>

            <!-- RODAPÉ -->
            <tr>
              <td style="font-size: 12px; color: #999; text-align: center">
                Este é um e-mail automático. Por favor, não responda.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
