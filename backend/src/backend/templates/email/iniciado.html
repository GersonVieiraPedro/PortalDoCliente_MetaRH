<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f0f0f0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .card {
        background: #fff;
        width: 420px;
        padding: 40px;
        text-align: center;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 6px solid #ddd;
        border-top-color: #4caf50;
        border-radius: 50%;
        margin: 20px auto;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .fade-in {
        animation: fadeIn 0.6s ease forwards;
        opacity: 0;
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="card" id="card">
      <h2 style="color: #333">Processando sua solicitação...</h2>
      <div class="spinner"></div>
      <p style="color: #555; font-size: 15px">Aguarde um instante.</p>
    </div>

    <script>
      setTimeout(() => {
        document.getElementById("card").innerHTML = `
            <h2 class="fade-in" style="color:#4CAF50;">Processo iniciado!</h2>
            <p class="fade-in" style="color:#555; font-size:15px; margin-top:12px;">
                Sua solicitação foi registrada e está sendo processada.
            </p>
        `;
      }, 3000);
    </script>
  </body>
</html>
