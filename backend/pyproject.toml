[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Portal Cliente"
authors = ["Gerson Vieira Pedro <80074869+GersonVieiraPedro@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "backend", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
cryptography = "==41.0.7"

# Web / API
fastapi = { version = ">=0.120.0,<0.121.0", extras = ["standard"] }
pyjwt = ">=2.10.1,<3.0.0"
pydantic-settings = ">=2.8.1,<3.0.0"

# DB / ORM / Migrações
sqlalchemy = ">=2.0.40,<3.0.0"
alembic = ">=1.15.2,<2.0.0"
pyodbc = ">=5.2.0,<6.0.0"

# Dados
pandas = ">=2.2.3,<3.0.0"
numpy = ">=2.2.5,<3.0.0"

# Azure Storage
azure-storage-blob = ">=12.25.1,<13.0.0"
azure-storage-file-datalake = ">=12.20.0,<13.0.0"

# Utilidades
pwdlib = { version = ">=0.2.1,<0.3.0", extras = ["argon2"] }
tzdata = ">=2025.2,<2026.0"
schedule = ">=1.2.2,<2.0.0"
pillow = ">=11.2.1,<12.0.0"
python-dotenv = "^1.0.1"  # usado em src/backend/email.py
beautifulsoup4 = "^4.14.2"
aiohttp = "^3.13.2"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
