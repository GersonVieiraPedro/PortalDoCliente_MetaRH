<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>{{ titulo }}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    "
  >
    <style>
      .TituloDetalhe {
        font-size: 16px;
        font-weight: bold;
        color: #333;
        padding-top: 10px;
      }

      .ValorDetalhe {
        font-size: 14px;
        color: #555;
        padding-top: 5px;
      }
    </style>

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 30px 0">
      <tr>
        <td align="center">
          <!-- CARD -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #ffffff;
              border-radius: 10px;
              min-height: 600px;
              padding: 30px;
              box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            "
          >
            <!-- TÍTULO -->
            <tr>
              <td
                style="
                  font-size: 24px;
                  font-weight: bold;
                  color: #222;
                  text-align: center;
                "
              >
                {{ titulo }}
              </td>
            </tr>

            <tr>
              <td style="height: 20px"></td>
            </tr>

            <!-- MENSAGEM PRINCIPAL -->
            <tr>
              <td
                style="
                  font-size: 15px;
                  color: #555;
                  line-height: 1.6;
                  text-align: left;
                "
              >
                Olá {{ nome }},<br /><br />
                {{ mensagem }}
              </td>
            </tr>

            <tr>
              <td style="height: 25px"></td>
            </tr>

            <tr>
              <td style="height: 35px"></td>
            </tr>

            <!-- BOTÕES -->
            <tr>
              <td align="center">
                <table
                  cellpadding="0"
                  cellspacing="0"
                  style="text-align: center"
                >
                  <tr>
                    <td>
                      <a
                        href="{{ link_finalizar }}"
                        style="
                          display: inline-block;
                          background: #28a745;
                          color: #fff;
                          padding: 12px 50px;
                          text-decoration: none;
                          border-radius: 6px;
                          font-size: 14px;
                          font-weight: bold;
                        "
                      >
                        Finalizar Processo
                      </a>
                    </td>

                    <td style="width: 20px"></td>

                    <td>
                      <a
                        href="{{ link_cancelar }}"
                        style="
                          display: inline-block;
                          background: #dc3545;
                          color: #fff;
                          padding: 12px 50px;
                          text-decoration: none;
                          border-radius: 6px;
                          font-size: 14px;
                          font-weight: bold;
                        "
                      >
                        Cancelar Processo
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="height: 25px"></td>
            </tr>

            <!-- RODAPÉ -->
            <tr>
              <td style="font-size: 12px; color: #999; text-align: center">
                Este é um e-mail automático. Por favor, não responda.
              </td>
            </tr>
          </table>
          <!-- FIM DO CARD -->
        </td>
      </tr>
    </table>
  </body>
</html>
